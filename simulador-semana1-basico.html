<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulador Semana 1 - Básico | KUNA Academia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0f2b4d, #1e3c72);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .header p { opacity: 0.9; font-size: 0.9rem; }
        .stats-bar {
            background: #ff6b35;
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-weight: bold;
        }
        .timer-section, .question-counter {
            background: rgba(0,0,0,0.2);
            padding: 5px 15px;
            border-radius: 30px;
        }
        .timer-section.warning {
            background: #d32f2f;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .quiz-body { padding: 30px; max-height: 60vh; overflow-y: auto; }
        .question-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            border-left: 5px solid #ff6b35;
        }
        .question-text { font-size: 1rem; font-weight: 600; margin-bottom: 15px; color: #1e3c72; }
        .question-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            margin-bottom: 10px;
            color: #495057;
        }
        .options { list-style: none; padding-left: 0; }
        .options li {
            margin: 12px 0;
            padding: 12px 15px;
            background: white;
            border-radius: 8px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.2s;
        }
        .options li:hover { background: #e9ecef; transform: translateX(5px); }
        .options li.selected {
            background: #d1e7ff;
            border-color: #ff6b35;
            border-left: 4px solid #ff6b35;
        }
        .btn-submit {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-submit:hover { background: #e55a2b; }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
        .results {
            background: #e8f5e9;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            display: none;
        }
        .results.show { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px);}
            to { opacity: 1; transform: translateY(0);}
        }
        .score { font-size: 2.5rem; font-weight: bold; color: #2e7d32; }
        .restart-btn {
            background: #1e3c72;
            margin-top: 15px;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            border: none;
        }
        .btn-volver {
            display: inline-block;
            background: transparent;
            color: #e25e00;
            border: 2px solid #e25e00;
            padding: 8px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn-volver:hover {
            background: #e25e00;
            color: white;
        }
        footer {
            text-align: center;
            padding: 15px;
            background: #f1f3f5;
            font-size: 0.8rem;
            color: #6c757d;
        }
        @media (max-width: 768px) {
            .quiz-body { padding: 20px; }
            .question-text { font-size: 0.9rem; }
            .stats-bar { flex-direction: column; text-align: center; }
        }
        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 10px;
            margin: 15px 0;
            height: 8px;
        }
        .progress-bar {
            background: #ff6b35;
            border-radius: 10px;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .feedback-container { max-height: 400px; overflow-y: auto; }
        .feedback-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid;
            text-align: left;
        }
        .feedback-correcto { background: #e8f5e9; border-color: #2e7d32; }
        .feedback-incorrecto { background: #ffebee; border-color: #c62828; }
        .feedback-no-respondida { background: #fff3e0; border-color: #ef6c00; }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 10px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📝 Cuestionario Básico - Semana 1</h1>
        <p>Números y operaciones · 10 preguntas · 15 minutos</p>
    </div>
    <div class="stats-bar">
        <div class="timer-section" id="timerDisplay">⏱️ Tiempo: 00:15:00</div>
        <div class="question-counter" id="counterDisplay">📋 Respondidas: 0 de 10</div>
    </div>
    <div class="quiz-body" id="quizBody">
        <div id="questionsContainer"></div>
        <button class="btn-submit" id="submitBtn">✅ Finalizar y calificar</button>
        <div id="results" class="results"></div>
        <div class="footer-links">
            <a href="secundaria-semana1.html" class="btn-volver">← Volver a la Semana 1</a>
        </div>
    </div>
    <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <footer>Simulador Semana 1 - Básico | KUNA Academia</footer>
</div>

<script>
    const questionBank = [
        { text: "$8 + 2 \\times 3 - 4$", options: ["10", "12", "14", "16"], correct: 0, tema: "Operaciones" },
        { text: "$12 \\div 3 \\times 2 + 4$", options: ["10", "12", "14", "16"], correct: 1, tema: "Operaciones" },
        { text: "$\\frac{3}{4} + \\frac{1}{4}$", options: ["1", "$\\frac{1}{2}$", "$\\frac{3}{8}$", "$\\frac{4}{8}$"], correct: 0, tema: "Fracciones" },
        { text: "$\\frac{2}{3} \\times \\frac{3}{4}$", options: ["$\\frac{1}{2}$", "$\\frac{2}{4}$", "$\\frac{3}{7}$", "$\\frac{6}{12}$"], correct: 0, tema: "Fracciones" },
        { text: "$0.5 + 0.25$", options: ["0.75", "0.25", "0.50", "1.00"], correct: 0, tema: "Decimales" },
        { text: "$0.75 \\times 2$", options: ["1.50", "1.25", "1.75", "2.00"], correct: 0, tema: "Decimales" },
        { text: "$15$ es el $\\%$ de $60$", options: ["20%", "25%", "30%", "40%"], correct: 1, tema: "Porcentajes" },
        { text: "Un descuento del 20% en un producto de $100", options: ["$80", "$90", "$70", "$85"], correct: 0, tema: "Porcentajes" },
        { text: "$(3 + 2) \\times 4$", options: ["20", "14", "15", "24"], correct: 0, tema: "Operaciones" },
        { text: "$\\frac{5}{6} - \\frac{1}{3}$", options: ["$\\frac{1}{2}$", "$\\frac{2}{3}$", "$\\frac{1}{6}$", "$\\frac{5}{18}$"], correct: 0, tema: "Fracciones" }
    ];

    const TOTAL_QUESTIONS = 10;
    const TIME_LIMIT_MIN = 15;
    
    let currentQuestions = [];
    let userAnswers = new Array(TOTAL_QUESTIONS).fill(null);
    let timer;
    let timeLeft = TIME_LIMIT_MIN * 60;
    let examFinished = false;

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function selectRandomQuestions() {
        const shuffledBank = shuffleArray([...questionBank]);
        return shuffledBank.slice(0, TOTAL_QUESTIONS);
    }

    function renderQuestions() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        currentQuestions.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-tag">📚 ${q.tema}</div>
                <div class="question-text">${idx+1}. ${q.text}</div>
                <ul class="options" data-qidx="${idx}">
                    ${q.options.map((opt, optIdx) => `<li data-optidx="${optIdx}">${String.fromCharCode(65+optIdx)}. ${opt}</li>`).join('')}
                </ul>
            `;
            container.appendChild(card);
        });
        document.querySelectorAll('.options').forEach(optContainer => {
            const qIdx = parseInt(optContainer.dataset.qidx);
            optContainer.querySelectorAll('li').forEach(li => {
                const optIdx = parseInt(li.dataset.optidx);
                li.addEventListener('click', () => {
                    if (examFinished) return;
                    optContainer.querySelectorAll('li').forEach(l => l.classList.remove('selected'));
                    li.classList.add('selected');
                    userAnswers[qIdx] = optIdx;
                    updateCounterAndProgress();
                });
                if (userAnswers[qIdx] === optIdx) li.classList.add('selected');
            });
        });
        updateCounterAndProgress();
    }

    function updateCounterAndProgress() {
        const answered = userAnswers.filter(a => a !== null).length;
        document.getElementById('counterDisplay').innerHTML = `📋 Respondidas: ${answered} de ${TOTAL_QUESTIONS}`;
        const progressPercent = (answered / TOTAL_QUESTIONS) * 100;
        document.getElementById('progressBar').style.width = `${progressPercent}%`;
    }

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function updateTimerDisplay() {
        const timerElement = document.getElementById('timerDisplay');
        timerElement.innerHTML = `⏱️ Tiempo: ${formatTime(timeLeft)}`;
        if (timeLeft <= 120 && timeLeft > 0) timerElement.classList.add('warning');
        else timerElement.classList.remove('warning');
        if (timeLeft <= 0 && !examFinished) {
            clearInterval(timer);
            examFinished = true;
            alert("⏰ Tiempo agotado. El examen se calificará automáticamente.");
            gradeExam();
        }
    }

    function startTimer() {
        timer = setInterval(() => {
            if (timeLeft > 0 && !examFinished) {
                timeLeft--;
                updateTimerDisplay();
            } else if (timeLeft <= 0 && !examFinished) {
                clearInterval(timer);
                examFinished = true;
                gradeExam();
            }
        }, 1000);
    }

    function gradeExam() {
        if (examFinished) return;
        examFinished = true;
        clearInterval(timer);
        
        let correctCount = 0;
        const temas = {};
        currentQuestions.forEach((q, idx) => {
            if (!temas[q.tema]) temas[q.tema] = { total: 0, correctos: 0 };
            temas[q.tema].total++;
            if (userAnswers[idx] !== null && userAnswers[idx] === q.correct) {
                correctCount++;
                temas[q.tema].correctos++;
            }
        });
        
        const percentage = (correctCount / TOTAL_QUESTIONS) * 100;
        const resultDiv = document.getElementById('results');
        
        let verdict = percentage >= 70 ? '🎉 ¡Excelente! Dominas los conceptos básicos.' : 
                     (percentage >= 50 ? '📚 Bien, pero necesitas practicar más.' : 
                     '⚠️ Te recomendamos repasar la teoría antes de continuar.');
        
        let temasHTML = '<div style="margin-top: 15px; text-align: left;"><h4>📊 Desempeño por tema:</h4><ul style="list-style: none;">';
        for (const [tema, data] of Object.entries(temas)) {
            const pct = Math.round((data.correctos / data.total) * 100);
            temasHTML += `<li><strong>${tema}:</strong> ${data.correctos}/${data.total} (${pct}%)</li>`;
        }
        temasHTML += '</ul></div>';
        
        let feedbackHTML = '<div style="margin-top: 20px; text-align: left;"><h4>📝 Revisión de respuestas:</h4><div class="feedback-container">';
        currentQuestions.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            const isCorrect = userAns !== null && userAns === q.correct;
            const correctText = q.options[q.correct];
            const userText = userAns !== null ? q.options[userAns] : 'No respondida';
            let clase = 'feedback-no-respondida';
            if (isCorrect) clase = 'feedback-correcto';
            else if (userAns !== null) clase = 'feedback-incorrecto';
            feedbackHTML += `
                <div class="feedback-item ${clase}">
                    <strong>${idx+1}. ${q.text}</strong><br>
                    ${isCorrect ? '✅ Correcto' : (userAns !== null ? '❌ Incorrecto' : '⬜ No respondida')}<br>
                    <span style="color: #2e7d32;">✓ Respuesta correcta: ${correctText}</span><br>
                    ${!isCorrect ? `<span style="color: #c62828;">✗ Tu respuesta: ${userText}</span><br>` : ''}
                </div>
            `;
        });
        feedbackHTML += '</div></div>';
        
        resultDiv.innerHTML = `
            <div class="score">${correctCount} / ${TOTAL_QUESTIONS}</div>
            <p style="font-size:1.2rem; margin:10px 0">Calificación: ${percentage.toFixed(1)}%</p>
            <p style="font-weight:bold; color:#d32f2f">${verdict}</p>
            ${temasHTML}
            ${feedbackHTML}
            <div style="margin-top: 20px;">
                <button class="restart-btn" id="restartBtn">🔄 Reintentar simulador</button>
                <a href="secundaria-semana1.html" class="btn-volver" style="display: inline-block; margin-top: 15px;">← Volver a la Semana 1</a>
            </div>
        `;
        resultDiv.classList.add('show');
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('submitBtn').style.opacity = '0.6';
        document.getElementById('restartBtn').addEventListener('click', () => location.reload());
    }

    function initExam() {
        currentQuestions = selectRandomQuestions();
        userAnswers = new Array(TOTAL_QUESTIONS).fill(null);
        renderQuestions();
        startTimer();
    }

    document.getElementById('submitBtn').addEventListener('click', () => { if (!examFinished && confirm("¿Seguro que deseas finalizar?")) gradeExam(); });
    
    initExam();
</script>
</body>
</html>
